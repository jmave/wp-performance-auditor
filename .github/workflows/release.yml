name: Release WordPress plugin

on:
  push:
    tags:
      - 'v*'
    paths:
      - '.release-version'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: zip -r wp-performance-auditor.zip wp-performance-auditor -x '*.DS_Store'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then TAG="$(cat .release-version)"; fi
          gh release create "$TAG" wp-performance-auditor.zip --target "${{ github.sha }}" --generate-notes
